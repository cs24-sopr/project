name: Dependabot Automerge

on:
  pull_request:

jobs:
  dependabot-automerge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-request: write

    steps:
      - uses: halostatue/dependabot-automerge@v1
        with:
          update-type: minor
          merge-type: squash
